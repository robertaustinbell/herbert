name: Template validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Verify generated index
        run: python3 scripts/generate_index.py --check

      - name: Check template integrity
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/check_template.py
          python3 skills/agent-prompt-design/scripts/test_context_trial_packet.py
          python3 skills/authority-effect-contracts/scripts/test_contracts.py
